<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth GenZ Pro - AI Powerhouse & Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .master-container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #38bdf8;
            letter-spacing: 0.8px;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* --- Chatbot Section --- */
        .chat-section {
            background-color: #0f172a;
            border-radius: 12px;
            border: 2px solid #334155;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-box {
            height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            margin-bottom: 10px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 85%;
            line-height: 1.4;
        }

        .msg.bot {
            background-color: #1e293b;
            color: #cbd5e1;
            align-self: flex-start;
            border: 1px solid #334155;
        }

        .msg.user {
            background-color: #0284c7;
            color: #fff;
            align-self: flex-end;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .chat-input-group button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* --- Image Generator Controls --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        button.gen-btn {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }

        button.gen-btn:hover {
            background-color: #0369a1;
        }

        .controls {
            margin-bottom: 25px;
            text-align: left;
            display: grid;
            gap: 15px;
        }

        .control-group label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: #38bdf8;
            color: #f8fafc;
        }

        .option-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }

        /* --- Image Box --- */
        .image-box {
            width: 100%;
            border-radius: 12px;
            border: 3px dashed #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #0f172a;
            position: relative;
            transition: 0.3s ease;
            margin-bottom: 20px;
        }

        .image-box.square { aspect-ratio: 1/1; }
        .image-box.vertical { aspect-ratio: 9/16; max-height: 400px; }
        .image-box.horizontal { aspect-ratio: 16/9; }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 14px;
            padding: 20px;
        }

        /* --- Loader --- */
        .loader-container {
            display: none;
            position: absolute;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loader {
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-buttons {
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-download { background-color: #10b981; }
        .btn-download:hover { background-color: #059669; }
        .btn-new { background-color: #334155; }
        .btn-new:hover { background-color: #475569; }
    </style>
</head>
<body>

    <div class="master-container">
        <h1>Samarth GenZ Pro</h1>
        <p class="subtitle">AI Assistant & High-Level Image Generator</p>

        <!-- Interactive AI Chat Assistant -->
        <div class="chat-section">
            <div class="chat-title">💬 Samarth Assistant</div>
            <div id="chatBox" class="chat-box">
                <div class="msg bot">Hello! Main Samarth AI Assistant hoon. Aap mujhse baat kar sakte hain ya bol sakte hain ki kaisi image banani hai!</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="Mujhse kuch bhi pucho..." onkeypress="handleKeyPress(event)" />
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>

        <!-- Image Prompt Section -->
        <div class="input-group">
            <input type="text" id="prompt" placeholder="Image description enter karein (e.g. Futuristic car)..." />
            <button class="gen-btn" onclick="generateProfessionalImage()">Generate</button>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label>1. Ratio Choose Karein</label>
                <div class="button-group" id="ratioGroup">
                    <button class="option-btn active" data-ratio="square">Square (1:1)</button>
                    <button class="option-btn" data-ratio="vertical">Vertical (9:16)</button>
                    <button class="option-btn" data-ratio="horizontal">Horizontal (16:9)</button>
                </div>
            </div>

            <div class="control-group">
                <label>2. Style Select Karein</label>
                <div class="button-group" id="styleGroup">
                    <button class="option-btn" data-style="Realistic Photo">Realistic Photo</button>
                    <button class="option-btn active" data-style="Cyberpunk">Cyberpunk</button>
                    <button class="option-btn" data-style="Anime Style">Anime Style</button>
                    <button class="option-btn" data-style="3D Render">3D Render</button>
                    <button class="option-btn" data-style="Graphic Design Poster">Design Poster</button>
                </div>
            </div>
        </div>

        <!-- Image Display -->
        <div id="imageBox" class="image-box square">
            <div id="loaderContainer" class="loader-container">
                <div class="loader"></div>
                <div class="loader-text">Aapki professional image ban rahi hai...</div>
            </div>
            <div id="placeholderContent" class="placeholder-content">
                <span style="font-size: 40px; margin-bottom: 10px;">🎨</span>
                <span>Yahan aapki powerful image dikhegi</span>
            </div>
            <img id="resultImage" alt="Generated High Quality Image" />
        </div>

        <div id="actionButtons" class="action-buttons">
            <a id="downloadBtn" class="action-btn btn-download" target="_blank" download="Samarth-GenZ-Pro-Image.png">Download Image</a>
            <button class="action-btn btn-new" onclick="resetForm()">New Image</button>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('prompt');
        const imageBox = document.getElementById('imageBox');
        const resultImage = document.getElementById('resultImage');
        const loaderContainer = document.getElementById('loaderContainer');
        const placeholderContent = document.getElementById('placeholderContent');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');

        let activeStyle = 'Cyberpunk';

        // --- Chatbot Logic ---
        function sendChatMessage() {
            const userMsg = chatInput.value.trim();
            if (!userMsg) return;

            // Display User Message
            addMessage(userMsg, 'user');
            chatInput.value = '';

            // Bot Response Generation
            setTimeout(() => {
                let botReply = getBotReply(userMsg);
                addMessage(botReply, 'bot');
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getBotReply(msg) {
            const lower = msg.toLowerCase();
            if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) {
                return "Namaste! Main Samarth GenZ Pro Assistant hoon. Main aapki kya madad kar sakta hoon?";
            } else if (lower.includes('image') || lower.includes('photo') || lower.includes('banaye')) {
                return "Aap neeche 'Image description' wale box mein likhein ki aapko kaisa photo chahiye aur 'Generate' dabayein!";
            } else if (lower.includes('kaise ho') || lower.includes('how are you')) {
                return "Main ekdum badhiya hoon! Aap bataiye, aaj kya create karna hai?";
            } else if (lower.includes('namaste') || lower.includes('kaun ho')) {
                return "Main Samarth AI Assistant hoon, aapka personal image generation helper!";
            } else {
                return `Main samajh gaya! Agar aapko "${msg}" ki photo chahiye toh niche box mein likh kar Generate button dabaiye.`;
            }
        }

        // --- Option Buttons Listener ---
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const parent = this.parentElement.id;
                document.getElementById(parent).querySelectorAll('.option-btn').forEach(groupBtn => {
                    groupBtn.classList.remove('active');
                });
                this.classList.add('active');

                if (parent === 'ratioGroup') {
                    imageBox.className = 'image-box ' + this.getAttribute('data-ratio');
                } else if (parent === 'styleGroup') {
                    activeStyle = this.getAttribute('data-style');
                }
            });
        });

        // --- Image Generation Logic ---
        function generateProfessionalImage() {
            let promptText = promptInput.value.trim();

            if (!promptText) {
                alert('Pehle kuch text likho!');
                return;
            }

            const enhancedPrompt = `${promptText}, ${activeStyle}, ultra detailed, 8k resolution`;

            placeholderContent.style.display = 'none';
            resultImage.style.display = 'none';
            actionButtons.style.display = 'none';
            loaderContainer.style.display = 'flex';

            const cleanPrompt = encodeURIComponent(enhancedPrompt);
            const randomSeed = Math.floor(Math.random() * 1000000);
            
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?seed=${randomSeed}&nologo=true&model=turbo`;

            resultImage.onload = function() {
                loaderContainer.style.display = 'none';
                resultImage.style.display = 'block';

                downloadBtn.href = imageUrl;
                actionButtons.style.display = 'flex';
                addMessage(`Aapki image generate ho gayi hai: "${promptText}"`, 'bot');
            };

            resultImage.onerror = function() {
                loaderContainer.style.display = 'none';
                placeholderContent.style.display = 'flex';
                alert('Server busy hai. Kripya fir se Generate par click karein!');
            };

            resultImage.src = imageUrl;
        }

        function resetForm() {
            promptInput.value = '';
            placeholderContent.style.display = 'flex';
            resultImage.style.display = 'none';
            resultImage.src = '';
            actionButtons.style.display = 'none';
            imageBox.className = 'image-box square';
            
            document.getElementById('ratioGroup').querySelector('button[data-ratio="square"]').click();
            document.getElementById('styleGroup').querySelector('button[data-style="Cyberpunk"]').click();
        }
    </script>
</body>
</html>
