<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth GenZ Pro - AI Assistant & Image Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background-color: #121212;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            border: 1px solid #222222;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #888888;
            font-size: 12px;
            margin-top: 4px;
        }

        /* Chat Output Area */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 5px;
            margin-bottom: 15px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background-color: #262626;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            border: 1px solid #333333;
        }

        .msg.bot {
            align-self: flex-start;
            background-color: #1a1a1a;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        /* Watermark Removal Container */
        .img-container {
            margin-top: 8px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333333;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            /* Bottom watermark crop trick */
            margin-bottom: -18px;
            transform: scale(1.03);
            transform-origin: top center;
        }

        /* Bottom Input Bar */
        .input-bar {
            display: flex;
            gap: 10px;
            background-color: #1a1a1a;
            padding: 8px 12px;
            border-radius: 25px;
            border: 1px solid #333333;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            padding: 6px 4px;
        }

        .input-bar input::placeholder {
            color: #666666;
        }

        .input-bar button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .input-bar button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Samarth GenZ Pro</h1>
            <div class="subtitle">Smart AI Assistant & Image Generator</div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">Hello! Main aapka Smart AI Assistant hoon. Mujhse kuch bhi pucho ya koi bhi image banane ko bolo!</div>
        </div>

        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Write anything..." onkeypress="if(event.key==='Enter') processInput()">
            <button onclick="processInput()">Send</button>
        </div>
    </div>

    <script>
        async function processInput() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userMsg = inputField.value.trim();

            if (!userMsg) return;

            // User message screen par show karein
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = userMsg;
            chatBox.appendChild(userDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const lowerMsg = userMsg.toLowerCase();

            // Image Generation Check
            const isImageReq = (lowerMsg.includes('photo') || lowerMsg.includes('image') || 
                                lowerMsg.includes('pic') || lowerMsg.includes('bnao') || 
                                lowerMsg.includes('banao') || lowerMsg.includes('draw')) && 
                               !lowerMsg.includes('kyun') && !lowerMsg.includes('kaise');

            if (isImageReq) {
                const botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                botDiv.innerText = "Creating...";
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                generateImage(userMsg, botDiv);
            } else {
                const botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                botDiv.innerText = "Loading...";
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                // Smart AI Response Fetching
                const aiReply = await getSmartAIReply(userMsg);
                botDiv.innerText = aiReply;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // Smart Conversational AI Engine
        async function getSmartAIReply(prompt) {
            try {
                const response = await fetch("https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        inputs: `<|system|>\nYou are Samarth AI, a helpful, smart, and friendly companion. Speak naturally in simple Hinglish or English as requested. Keep replies concise and intelligent.<|end|>\n<|user|>\n${prompt}<|end|>\n<|assistant|>\n`,
                        parameters: { max_new_tokens: 150, temperature: 0.7 }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    let reply = data[0].generated_text.split('<|assistant|>\n')[1];
                    if (reply) return reply.trim();
                }
            } catch (e) {
                console.log("API Error, falling back to local engine");
            }

            // Fallback smart replies
            const lower = prompt.toLowerCase();
            if (lower.includes('tum kaise ho') || lower.includes('kaise ho')) {
                return "Main ekdum badhiya hoon! Aap batao, aaj kya chal raha hai?";
            } else if (lower.includes('tum kaun ho') || lower.includes('who are you')) {
                return "Main Samarth AI hoon! Aapka smart companion, jo baatein bhi kar sakta hai aur images bhi bana sakta hai.";
            } else {
                return "Main aapki baat samajh gaya! Aap mujhse koi bhi sawal pooch sakte hain ya image banane ko bol sakte hain.";
            }
        }

        function generateImage(fullPrompt, botMsgElement) {
            const chatBox = document.getElementById('chatBox');

            // Cleaning Hinglish words for accurate image generation
            let cleanPrompt = fullPrompt.replace(/(banao|bnao|bana do|chahiye|dikhao|generate|create|an|a|image|photo|pic|picture|ki|ka|ko|draw|please)/gi, '').trim();

            if (!cleanPrompt || cleanPrompt.length < 2) {
                cleanPrompt = fullPrompt;
            }

            const encodedPrompt = encodeURIComponent(cleanPrompt);
            const randomSeed = Math.floor(Math.random() * 1000000);

            // Watermark free URL parameters
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${randomSeed}&nologo=true&nofeed=true`;

            const imgContainer = document.createElement('div');
            imgContainer.className = 'img-container';

            const img = document.createElement('img');
            img.src = imageUrl;

            img.onload = () => {
                botMsgElement.innerText = `Here is your image for: "${cleanPrompt}"`;
                imgContainer.appendChild(img);
                botMsgElement.appendChild(imgContainer);
                chatBox.scrollTop = chatBox.scrollHeight;
            };

            img.onerror = () => {
                botMsgElement.innerText = "Failed to generate image. Please try again.";
            };
        }
    </script>
</body>
</html>
