<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="vOhPgGJIkzKSu2ylNAj9PEF141CTSLx8bE6LMas1trc" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth GenZ Pro - Smart AI Assistant</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090a0f 0%, #121829 100%);
            --card-bg: rgba(18, 24, 41, 0.85);
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.2);
            --accent-glow: #00d2ff;
            --user-msg-bg: #1e293b;
            --bot-msg-bg: #0f172a;
            --input-bg: #0f172a;
        }

        .light-theme {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: rgba(14, 165, 233, 0.3);
            --accent-glow: #0284c7;
            --user-msg-bg: #e2e8f0;
            --bot-msg-bg: #f8fafc;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%; max-width: 480px; height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 24px; padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 210, 255, 0.15);
            display: flex; flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative; overflow: hidden;
        }

        /* Branding Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .brand-info {
            display: flex; align-items: center; gap: 12px;
        }

        .app-logo {
            width: 44px; height: 44px; border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-glow);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .header-title h1 {
            color: var(--text-color); font-size: 17px; font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-title .subtitle {
            color: var(--subtext-color); font-size: 11px; margin-top: 2px;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            color: var(--text-color); font-size: 18px; cursor: pointer;
            padding: 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        }

        /* Dropdown Settings Menu */
        .dropdown-menu {
            display: none; position: absolute; top: 65px; right: 20px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; width: 200px; z-index: 100;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); backdrop-filter: blur(12px);
        }

        .dropdown-menu div {
            padding: 12px 16px; font-size: 13px; color: var(--text-color);
            cursor: pointer; border-bottom: 1px solid var(--border-color);
        }
        .dropdown-menu div:last-child { border-bottom: none; }

        /* Chat Workspace */
        .chat-box {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column;
            gap: 12px; padding: 10px 4px; margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 85%; padding: 12px 16px; border-radius: 18px;
            font-size: 13.5px; line-height: 1.5; word-wrap: break-word; white-space: pre-line;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .msg.user {
            align-self: flex-end; background-color: var(--user-msg-bg);
            color: var(--text-color); border-bottom-right-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .msg.bot {
            align-self: flex-start; background-color: var(--bot-msg-bg);
            color: var(--text-color); border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Input Controls */
        .input-bar {
            display: flex; gap: 8px; background-color: var(--input-bg);
            padding: 8px 12px; border-radius: 30px; border: 1px solid var(--border-color); align-items: center;
        }

        .input-bar input {
            flex: 1; background: transparent; border: none;
            color: var(--text-color); font-size: 14px; outline: none; padding: 6px 6px;
        }

        .input-bar button.send-btn {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: #ffffff; border: none; padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: 600; font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        /* Modal Overlay */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); border-radius: 24px; justify-content: center; align-items: center; z-index: 200;
        }

        .modal-content {
            background-color: var(--card-bg); padding: 25px; border-radius: 20px;
            width: 85%; border: 1px solid var(--border-color); text-align: center; color: var(--text-color);
        }

        .modal-content input {
            width: 100%; padding: 10px; margin-bottom: 10px; background: var(--input-bg);
            border: 1px solid var(--border-color); color: var(--text-color); border-radius: 10px; outline: none;
        }

        .modal-content button {
            width: 100%; padding: 10px; background: var(--accent-glow); color: #000;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }

        .close-btn { background: transparent !important; color: var(--subtext-color) !important; margin-top: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Image Logo -->
        <div class="header">
            <div class="brand-info">
                <!-- Change image src to your uploaded logo file name e.g., logo.png -->
                <img src="1000078316.png" alt="Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/44/00d2ff/ffffff?text=S'">

                <div class="header-title">
                    <h1>SAMARTH GENZ PRO</h1>
                    <div class="subtitle" id="userStatus">Next-Gen AI Companion</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
                <button class="icon-btn" onclick="toggleMenu()" title="Settings">⋮</button>
            </div>
        </div>

        <!-- Menu -->
        <div class="dropdown-menu" id="dropdownMenu">
            <div onclick="openAuth('login')">🔑 Login</div>
            <div onclick="openAuth('signup')">📝 Signup</div>
            <div onclick="clearChat()">🗑️ Clear Chat History</div>
        </div>

        <!-- Chat Workspace -->
        <div class="chat-box" id="chatBox"></div>

        <!-- Input Bar -->
        <div class="input-bar">
            <button class="icon-btn" onclick="startVoiceInput()" title="Voice Input">🎙️</button>
            <input type="text" id="userInput" placeholder="Ask Samarth anything..." onkeypress="if(event.key==='Enter') processInput()">
            <button class="send-btn" onclick="processInput()">Send</button>
        </div>

        <!-- Auth Modal -->
        <div class="modal" id="authModal">
            <div class="modal-content">
                <h2 id="modalTitle">Login</h2>
                <input type="text" id="authName" placeholder="Full Name" style="display:none;">
                <input type="email" id="authEmail" placeholder="Email Address">
                <input type="password" id="authPass" placeholder="Password">
                <button onclick="handleAuth()" id="modalBtn">Submit</button>
                <button class="close-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Connected Brain Script -->
    <script src="brain.js"></script>

    <script>
        window.onload = function() {
            loadChat();
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
        };

        function toggleMenu() {
            const m = document.getElementById('dropdownMenu');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function loadChat() {
            const h = localStorage.getItem('samarth_chat_history');
            const box = document.getElementById('chatBox');
            box.innerHTML = h || '<div class="msg bot">Hello! Main Samarth AI Assistant hoon. Poochiye aapka kya sawaal hai?</div>';
            box.scrollTop = box.scrollHeight;
        }

        function clearChat() {
            localStorage.removeItem('samarth_chat_history');
            loadChat();
            toggleMenu();
        }

        function openAuth(m) {
            toggleMenu();
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = m === 'login' ? 'Login' : 'Create Account';
            document.getElementById('authName').style.display = m === 'signup' ? 'block' : 'none';
        }

        function closeModal() { document.getElementById('authModal').style.display = 'none'; }

        function handleAuth() {
            alert("Security verified! Logged in successfully.");
            closeModal();
        }

        function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return alert("Voice Input browser dwara support nahi hai!");
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const r = new SpeechRecognition();
            r.lang = 'hi-IN';
            r.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
            r.start();
        }

        function processInput() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const val = input.value.trim();
            if (!val) return;

            // Security Check Execution via brain.js
            const securityCheck = runSecurityCheck(val);
            if (!securityCheck.safe) {
                alert(securityCheck.error);
                return;
            }

            // Append User Message
            const uDiv = document.createElement('div');
            uDiv.className = 'msg user';
            uDiv.innerText = securityCheck.text;
            chatBox.appendChild(uDiv);
            input.value = '';

            // Append Thinking State
            const bDiv = document.createElement('div');
            bDiv.className = 'msg bot';
            bDiv.innerText = "Thinking...";
            chatBox.appendChild(bDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Brain Processing Delay
            setTimeout(() => {
                bDiv.innerText = getSamarthBrainResponse(securityCheck.text);
                chatBox.scrollTop = chatBox.scrollHeight;
                localStorage.setItem('samarth_chat_history', chatBox.innerHTML);
            }, 350);
        }
    </script>
</body>
</html>
