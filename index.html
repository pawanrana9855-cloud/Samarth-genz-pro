<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth GenZ Pro - AI Image Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .image-box {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            border: 2px dashed #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #0f172a;
            position: relative;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: #64748b;
            font-size: 14px;
        }

        .loader {
            display: none;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Samarth GenZ Pro</h1>
        <p>GenZ style mein AI images generate karo!</p>

        <div class="input-group">
            <input type="text" id="prompt" placeholder="E.g. A futuristic city at sunset..." />
            <button onclick="generateImage()">Generate</button>
        </div>

        <div class="image-box">
            <div id="loader" class="loader"></div>
            <span id="placeholderText" class="placeholder-text">Yahan aapki image dikhegi</span>
            <img id="resultImage" alt="Generated Image" />
        </div>
    </div>

    <script>
        function generateImage() {
            const promptInput = document.getElementById('prompt').value.trim();
            const resultImage = document.getElementById('resultImage');
            const placeholderText = document.getElementById('placeholderText');
            const loader = document.getElementById('loader');

            if (!promptInput) {
                alert('Pehle kuch text likho!');
                return;
            }

            // UI Adjustments while loading
            placeholderText.style.display = 'none';
            resultImage.style.display = 'none';
            loader.style.display = 'block';

            // Clean prompt for URL
            const cleanPrompt = encodeURIComponent(promptInput);
            
            // Random seed to get fresh images every time
            const randomSeed = Math.floor(Math.random() * 100000);
            
            // Pollinations.ai free URL
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?seed=${randomSeed}&width=500&height=500&nologo=true`;

            // Preload image
            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                loader.style.display = 'none';
                resultImage.src = imageUrl;
                resultImage.style.display = 'block';
            };

            img.onerror = function() {
                loader.style.display = 'none';
                placeholderText.style.display = 'block';
                placeholderText.innerText = 'Image load nahi ho payi. Dobara try karein.';
                alert('Image generate karne mein koi problem hui.');
            };
        }
    </script>

</body>
</html>
