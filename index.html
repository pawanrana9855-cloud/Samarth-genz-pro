<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth GenZ Pro - AI Image Powerhouse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .master-container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #38bdf8;
            letter-spacing: 0.8px;
            font-weight: 800;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button.gen-btn {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }

        button.gen-btn:hover {
            background-color: #0369a1;
        }

        /* --- New Controls Section --- */
        .controls {
            margin-bottom: 25px;
            text-align: left;
            display: grid;
            gap: 15px;
        }

        .control-group label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: #38bdf8;
            color: #f8fafc;
        }

        .option-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }

        /* --- Image Box --- */
        .image-box {
            width: 100%;
            border-radius: 12px;
            border: 3px dashed #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #0f172a;
            position: relative;
            transition: 0.3s ease;
            margin-bottom: 20px;
        }

        .image-box.square { aspect-ratio: 1/1; }
        .image-box.vertical { aspect-ratio: 9/16; max-height: 400px; }
        .image-box.horizontal { aspect-ratio: 16/9; }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 14px;
            padding: 20px;
        }

        /* --- Professional Loader --- */
        .loader-container {
            display: none;
            position: absolute;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loader {
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Action Buttons --- */
        .action-buttons {
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-download {
            background-color: #10b981;
        }

        .btn-download:hover {
            background-color: #059669;
        }

        .btn-new {
            background-color: #334155;
        }

        .btn-new:hover {
            background-color: #475569;
        }

    </style>
</head>
<body>

    <div class="master-container">
        <h1>Samarth GenZ Pro</h1>
        <p>Aapki high-level AI image generation powerhouse!</p>

        <div class="input-group">
            <input type="text" id="prompt" placeholder="E.g. Make a professional Sunday poster with quote Happy Sunday..." />
            <button class="gen-btn" onclick="generateProfessionalImage()">Generate</button>
        </div>

        <!-- Professional Controls -->
        <div class="controls">
            <!-- 1. Aspect Ratio -->
            <div class="control-group">
                <label>1. Ratio Choose Karein</label>
                <div class="button-group" id="ratioGroup">
                    <button class="option-btn active" data-ratio="square" data-dim="1024x1024">Square (1:1)</button>
                    <button class="option-btn" data-ratio="vertical" data-dim="1024x1792">Vertical (9:16)</button>
                    <button class="option-btn" data-ratio="horizontal" data-dim="1792x1024">Horizontal (16:9)</button>
                </div>
            </div>

            <!-- 2. Art Style -->
            <div class="control-group">
                <label>2. Style Select Karein</label>
                <div class="button-group" id="styleGroup">
                    <button class="option-btn" data-style="Realistic Photo">Realistic Photo</button>
                    <button class="option-btn active" data-style="Cyberpunk">Cyberpunk</button>
                    <button class="option-btn" data-style="Anime Style">Anime Style</button>
                    <button class="option-btn" data-style="3D Render">3D Render</button>
                    <button class="option-btn" data-style="Graphic Design Poster">Design Poster</button>
                </div>
            </div>
        </div>

        <!-- Modern Image Viewer -->
        <div id="imageBox" class="image-box square">
            <div id="loaderContainer" class="loader-container">
                <div class="loader"></div>
                <div class="loader-text">Aapki professional image ban rahi hai...</div>
            </div>
            <div id="placeholderContent" class="placeholder-content">
                <span style="font-size: 40px; margin-bottom: 10px;">🎨</span>
                <span>Yahan aapki powerfull image dikhegi</span>
            </div>
            <img id="resultImage" alt="Generated High Quality Image" />
        </div>

        <!-- Action Buttons (Download) -->
        <div id="actionButtons" class="action-buttons">
            <a id="downloadBtn" class="action-btn btn-download" download="Samarth-GenZ-Pro-Image.png">Download Image</a>
            <button class="action-btn btn-new" onclick="resetForm()">New Image</button>
        </div>
    </div>

    <script>
        // --- Setup Variables ---
        const promptInput = document.getElementById('prompt');
        const imageBox = document.getElementById('imageBox');
        const resultImage = document.getElementById('resultImage');
        const loaderContainer = document.getElementById('loaderContainer');
        const placeholderContent = document.getElementById('placeholderContent');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');

        let activeRatio = '1024x1024';
        let activeStyle = 'Cyberpunk';

        // --- Event Listeners for Controls ---
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Find parent container to identify which group was clicked
                const parent = this.parentElement.id;
                
                // Reset active class in the specific group
                document.getElementById(parent).querySelectorAll('.option-btn').forEach(groupBtn => {
                    groupBtn.classList.remove('active');
                });
                
                // Add active class to clicked button
                this.classList.add('active');

                // Set values based on group
                if (parent === 'ratioGroup') {
                    activeRatio = this.getAttribute('data-dim');
                    // Update ImageBox CSS Class
                    imageBox.className = 'image-box ' + this.getAttribute('data-ratio');
                } else if (parent === 'styleGroup') {
                    activeStyle = this.getAttribute('data-style');
                }
            });
        });

        // --- Core Image Generation Logic (Flux Model) ---
        function generateProfessionalImage() {
            let promptText = promptInput.value.trim();

            if (!promptText) {
                alert('Pehle kuch text likho!');
                return;
            }

            // Automatic Prompt Optimization/Enhancement
            // Adds quality terms, art style, and ensures professional output
            const enhancedPrompt = `${promptText}, ${activeStyle}, ultra highly detailed, professional composition, masterwork, 8k resolution, cinematic lighting, no text errors, photorealistic`;

            // UI Adjustments while loading
            placeholderContent.style.display = 'none';
            resultImage.style.display = 'none';
            actionButtons.style.display = 'none';
            loaderContainer.style.display = 'flex';

            // Clean prompt for URL
            const cleanPrompt = encodeURIComponent(enhancedPrompt);
            
            // Random seed to ensure unique generations
            const randomSeed = Math.floor(Math.random() * 1000000);
            const dimensions = activeRatio.split('x');
            const width = dimensions[0];
            const height = dimensions[1];
            
            // --- Pollinations.ai FLUX URL (Master Model) ---
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?model=flux&seed=${randomSeed}&nologo=true`;


            // Preload image to ensure smooth display
            const img = new Image();
            img.src = imageUrl;

            img.onload = function() {
                loaderContainer.style.display = 'none';
                resultImage.src = imageUrl;
                resultImage.style.display = 'block';

                // Setup Download Button
                downloadBtn.href = imageUrl;
                downloadBtn.download = `Samarth_GenZ_${promptText.slice(0, 15).replace(/\s+/g, '_')}_${randomSeed}.png`;
                
                actionButtons.style.display = 'flex';
            };

            img.onerror = function() {
                loaderContainer.style.display = 'none';
                placeholderContent.style.display = 'flex';
                alert('High-level generation failed. Dobara try karein.');
            };
        }

        // --- Helper Function ---
        function resetForm() {
            promptInput.value = '';
            placeholderContent.style.display = 'flex';
            resultImage.style.display = 'none';
            resultImage.src = '';
            actionButtons.style.display = 'none';
            imageBox.className = 'image-box square';
            
            // Reset active buttons
            document.getElementById('ratioGroup').querySelector('button[data-ratio="square"]').click();
            document.getElementById('styleGroup').querySelector('button[data-style="Cyberpunk"]').click();
        }

    </script>

</body>
  </html>
